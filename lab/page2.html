<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Two · Luna Motion Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%237c5cff%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../kit/kit.css">
<link rel="stylesheet" href="lab.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js" defer></script>
<script type="module">
  import * as transition from '../kit/page-transition.js';
  import * as split from '../kit/split-reveal.js';
  import * as magnetic from '../kit/magnetic.js';
  import * as grain from '../kit/grain.js';
  window.addEventListener('DOMContentLoaded', async () => {
    transition.init({ color: '#ecebf5', label: 'Luna Motion Lab' });
    grain.init({ opacity: 0.08 });
    magnetic.init({ ring: true });
    await document.fonts.ready;
    split.init(document.querySelectorAll('[data-split]'));
  });
</script>
</head>
<body>
<header class="nav">
  <a class="brand" href="index.html" data-transition data-magnetic="0.2"><span class="dot" aria-hidden="true"></span>Luna Motion Lab</a>
</header>
<main class="block fog" style="min-height:100vh">
  <p class="tag">page-transition</p>
  <h1 style="font:700 clamp(52px,10vw,140px)/.92 var(--display);letter-spacing:-.045em;margin:0 0 28px" data-split="chars">Page two.</h1>
  <p class="note" style="margin-bottom:36px">You arrived under the curtain. Going back plays it again.</p>
  <p><a class="btn btn--big" href="index.html" data-transition data-magnetic="0.45">← Back to the lab</a></p>
</main>
</body>
</html>
