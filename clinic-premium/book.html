<!doctype html>
<!-- Nurvale Dental Studio premium demo: "Book a visit" page (demo only, nothing is sent). -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a visit · Nurvale Dental Studio (demo)</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%232f6f66%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="premium.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js" defer></script>
<script type="module" src="premium.js"></script>
</head>
<body data-page="book">
<a class="skip" href="#main" data-i18n="skip">Skip to content</a>
<header class="bar">
  <a class="logo" href="index.html" data-transition data-keep-lang aria-label="Nurvale Dental Studio, home" data-i18n-aria="brand">
    <svg viewBox="0 0 160 190" width="20" height="24" aria-hidden="true"><path fill="currentColor" d="M60 20C40 20 25 35 25 60c0 25 10 40 15 70 3 20 8 40 18 40s10-30 17-45c3-7 7-7 10 0 7 15 7 45 17 45s15-20 18-40c5-30 15-45 15-70 0-25-15-40-35-40-10 0-12 8-20 8s-10-8-20-8z"/></svg>
    <span data-i18n="brand">Nurvale Dental Studio</span>
  </a>
  <nav class="bar-actions" aria-label="Main"><button class="lang" type="button" id="langBtn" lang="ar">العربية</button></nav>
</header>

<main id="main" class="bookpage">
  <h1 class="bk-title" data-split="chars" data-i18n="bTitle">Book a visit</h1>
  <p class="bk-lead" data-i18n="bLead">Choose a visit and a time. Your real booking tool connects here.</p>
  <form class="bk-form" onsubmit="return false" aria-describedby="bk-note">
    <fieldset class="bk-group"><legend data-i18n="bType">Type of visit</legend>
      <label class="chip"><input type="radio" name="v" checked><span data-i18n="bv1">Check-up and cleaning</span></label>
      <label class="chip"><input type="radio" name="v"><span data-i18n="bv2">Whitening consultation</span></label>
      <label class="chip"><input type="radio" name="v"><span data-i18n="bv3">Aligner consultation</span></label>
    </fieldset>
    <fieldset class="bk-group"><legend data-i18n="bDay">Day</legend><div class="bk-days" id="bkDays"></div></fieldset>
    <fieldset class="bk-group"><legend data-i18n="bTime">Time</legend>
      <div class="bk-times">
        <label class="chip"><input type="radio" name="t" checked><span dir="ltr">10:00</span></label>
        <label class="chip"><input type="radio" name="t"><span dir="ltr">11:30</span></label>
        <label class="chip"><input type="radio" name="t"><span dir="ltr">14:00</span></label>
        <label class="chip"><input type="radio" name="t"><span dir="ltr">16:30</span></label>
      </div>
    </fieldset>
    <p class="bk-note" id="bk-note" data-i18n="bNote">Demo only: nothing is sent and no booking is made.</p>
    <div class="cta-row">
      <button class="btn" type="submit" data-magnetic data-i18n="bCta">Continue</button>
      <a class="link" href="index.html" data-transition data-keep-lang data-magnetic="0.2" data-i18n="bBack">Back to the clinic</a>
    </div>
  </form>
</main>
<footer class="foot"><p data-i18n="foot">Demo site by Luna HQ, made-up clinic.</p></footer>
</body>
</html>
